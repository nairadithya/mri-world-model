name: Notebook source pairs

on:
  pull_request:
  push:

jobs:
  notebook-pairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jupytext
      - run: python -m unittest discover -s tests -p 'test_notebook_pair_check.py'
      - run: python scripts/check_notebook_pairs.py
