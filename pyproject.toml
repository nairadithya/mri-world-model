[project]
name = "world-model"
version = "0.1.0"
description = "JEPA world model over longitudinal glioma MRI (LUMIERE / SAILOR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "monai>=1.3",
    "nibabel>=5.2",
    "SimpleITK>=2.4",
    "peft>=0.8",
    # D16: peft 0.20 imports Bloom classes removed in transformers 5.
    "transformers<5",
    "einops>=0.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "wandb>=0.15",
    "hd-bet",
    "safetensors>=0.4",
    "tqdm>=4.65",
    # Imported directly but absent from the old requirements.txt.
    "requests>=2.31",
    "ebrains-kg-core>=0.9",
]

# Dev-only tooling. playwright drives the headless NIfTI-viewer screenshot
# check (scripts/shot_viewer.py); jupytext regenerates the Kaggle notebooks
# from their .py sources (never edit an .ipynb by hand). Opt in with
# `uv sync --extra viewer` and/or `uv sync --extra dev`.
[project.optional-dependencies]
viewer = [
    "playwright>=1.40",
]
dev = [
    "jupytext>=1.16",
]

[tool.uv]
package = false
# D37: resolve CPU-only torch from the PyTorch index. PyPI's torch tops out at
# 2.9.1 and has no cp314 wheels; the CPU index has 2.14.0+cpu (what the dev
# host runs) without pulling the multi-GB CUDA wheels.
# D16: never install torchvision — a skewed build breaks the peft import with
# a misleading `torchvision::nms` error. hd-bet → nnunetv2 →
# dynamic-network-architectures → timm drags it in transitively, so the ban is
# enforced here (not just documented) and the lock stays torchvision-free.
required-version = ">=0.9.8"  # first release with `exclude-dependencies`
exclude-dependencies = ["torchvision"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
